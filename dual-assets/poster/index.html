<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="icon" href="data:,"><title>Tockett · Native layout code poster</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#292c2a}#poster{position:relative;width:2400px;height:1400px;overflow:hidden;background:#292c2a}.airport{position:absolute;left:250px;top:460px;width:900px;height:434.324px}.cuckoo{position:absolute;left:1250px;top:542.37px;width:900px;height:351.95px}.wordmark{position:absolute;left:1900px;top:1130px;width:260px;height:76px;overflow:hidden}.wordmark img{position:absolute;left:-6.52px;top:-18.9px;width:276.36px;height:auto}svg{display:block;width:100%;height:100%}text{font-kerning:none}

<main id="poster" aria-label="Tockett双表盘留白海报，按实际App源码布局">
<svg class="airport" viewBox="0 0 976 471" role="img" aria-label="机场牌App横屏，23列原生布局"><g id="airport-body"></g></svg>
<svg class="cuckoo" viewBox="0 80 1432 560" role="img" aria-label="报时鸟，原生透明钟壳，代码数字和角色定位"><defs><clipPath id="bird-clip"><rect x="892" y="188" width="370" height="298"/></clipPath><clipPath id="h1"><rect x="188" y="194" width="332" height="272"/></clipPath><clipPath id="h2"><rect x="548" y="194" width="336" height="272"/></clipPath></defs><image href="shell-alpha.png" x="0" y="0" width="1432" height="672"/><g id="clock-digits"></g><image href="bird.jpg" x="892" y="176" width="380" height="320" clip-path="url(#bird-clip)"/><text x="1124" y="179" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Arial" font-size="28" fill="#282b24">TPE · UTC+8</text></svg>

<script src="/dual-assets/typefaces/render.js"></script><script>
(async()=>{if(new URLSearchParams(location.search).get('lang')==='en'){document.documentElement.lang='en';document.querySelector('main').setAttribute('aria-label','Tockett two-clock poster using native product geometry');document.querySelector('.airport').setAttribute('aria-label','Airport Board landscape preview');document.querySelector('.cuckoo').setAttribute('aria-label','Cuckoo Clock landscape preview')}const typography=await window.TockettTypefaceReady;
const ns='http://www.w3.org/2000/svg',g=document.querySelector('#airport-body');const e=(tag,a,parent=g)=>{let n=document.createElementNS(ns,tag);Object.entries(a).forEach(([k,v])=>n.setAttribute(k,v));parent.append(n);return n},rect=(x,y,width,height,fill,p=g,rx=0)=>e('rect',{x,y,width,height,fill,rx},p);
const cv=typography.canvas(document.createElement('canvas').getContext('2d'));cv.font='100px DIN';let cap=cv.measureText('H').actualBoundingBoxAscent/100,maxAdvance=Math.max(...[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'].map(c=>cv.measureText(c).width))/100;
// AirportClockLayout(width:960,height:455,8 rows,2 groups,tablet:false).
const W=960,pitch=W/390*15,large=W/390*24,gap=1.6,insetX=1.1,insetY=2.8,rowH=48,flapH=rowH-insetY*2,x=c=>c<18?c*pitch:18*pitch+(c-18)*large;
rect(0,0,976,471,'#151716',g,3);let inner=e('g',{transform:'translate(8 8)'});
const header=(stock,y)=>{rect(0,y,W,18,'#1b1b1b',inner);rect(0,y+17,W,1,'#000',inner);(stock?[[0,'TICKER'],[6,'MARKET'],[12,'CHANGE %'],[18,'PRICE·USD']]:[[0,'CITY'],[12,'UTC'],[18,'D/N'],[19,'TIME']]).forEach(([i,t])=>{e('text',{x:x(i)+2,y:y+13,'font-family':'DIN','font-size':12,'letter-spacing':.9,fill:'#d98740'},inner).textContent=t})};
const rows=[['TAIPEI','+0800','sun','1008'],['TOKYO','+0900','sun','1108'],['LONDON','+0100','moon','0308'],['NEW YORK','-0400','moon','2208'],['AAPL','NASDAQ','+082','$','22752'],['NVDA','NASDAQ','-034','$','13865'],['MSFT','NASDAQ','+051','$','41526'],['TSLA','NASDAQ','+124','$','21880']];
let y=0;rows.forEach((r,ri)=>{let stock=ri>=4;if(ri===0||ri===4){header(stock,y);y+=18}let data=Array(23).fill(' '),put=(s,at,n)=>[...s.padEnd(n,' ').slice(0,n)].forEach((c,i)=>data[at+i]=c);if(!stock){put(r[0],0,12);put(r[1],12,6);data[18]=r[2];put(r[3],19,4)}else{put(r[0],0,6);put(r[1],6,6);put(r[2],12,5);data[17]=r[3];put(r[4],18,5)}
rect(0,y,W,rowH,'#171717',inner);
data.forEach((c,i)=>{let w=(i<18?pitch:large)-gap,l=x(i);rect(l,y,w,rowH,'#050505',inner,.8);rect(l+w-insetX,y+1,insetX,rowH-1,'#111',inner);rect(l+.5,y+rowH-insetY,w-.5,insetY,'#0d0d0d',inner);let fw=w-2*insetX,fx=l+insetX,fy=y+insetY,day=!stock&&i>=19&&r[2]==='sun';let ink=day?'#1f1f1f':stock&&(i>=12&&i<=16||i>=18)?(r[2][0]==='+'?'#5cd194':'#f06e70'):'#ebe8db';let variation=((ri*23+i)%7-3)*.0015;rect(fx,fy,fw,flapH/2,day?'#dedacc':`rgb(${(0.125+variation)*255} ${(0.125+variation)*255} ${(0.125+variation)*255})`,inner,.8);rect(fx,fy+flapH/2,fw,flapH/2,day?'#e0ddcf':`rgb(${(0.118+variation)*255} ${(0.118+variation)*255} ${(0.118+variation)*255})`,inner,.8);
if(c==='sun'||c==='moon'){const cx=fx+fw/2,cy=fy+flapH/2,rad=Math.min(fw*.62,flapH*.48)/2;if(c==='sun'){e('circle',{cx,cy,r:rad*.55,fill:'#d98740'},inner);for(let k=0;k<8;k++){let a=k*Math.PI/4;e('line',{x1:cx+Math.cos(a)*rad*.77,y1:cy+Math.sin(a)*rad*.77,x2:cx+Math.cos(a)*rad,y2:cy+Math.sin(a)*rad,stroke:'#d98740','stroke-width':1.5},inner)}}else{e('circle',{cx,cy,r:rad,fill:'#d98740'},inner);e('circle',{cx:cx+rad*.58,cy:cy-rad*.3,r:rad*.91,fill:'#202020'},inner)}}else if(c!==' '){let fs=Math.min(flapH*(i>=18?.82:.78)/cap,fw*.9/maxAdvance);cv.font=fs+'px DIN';if(cv.measureText(c).width>fw*.9)fs*=fw*.9/cv.measureText(c).width;cv.font=fs+'px DIN';let cm=cv.measureText('H');e('text',{x:fx+fw/2,y:fy+(flapH+cm.actualBoundingBoxAscent)/2,'text-anchor':'middle','font-family':'DIN','font-size':fs,fill:ink},inner).textContent=c}
rect(fx,fy+flapH/2-.2,fw,.45,'#000',inner);for(let a of [fx,fx+fw-1.3])rect(a,fy+flapH/2-1.1,1.3,2.2,'#0b0b0b',inner)
});if(stock){for(let col of [14,21])e('circle',{cx:x(col)-gap/2,cy:y+38,r:1.2,fill:r[2][0]==='+'?'#5cd194':'#f06e70'},inner)}else for(let f of [.35,.65])e('circle',{cx:x(21)-gap/2,cy:y+rowH*f,r:.8,fill:'#ebe8db'},inner);y+=rowH;if(ri<7){rect(0,y,W,5,'#161616',inner);y+=5}});
const cg=document.querySelector('#clock-digits');cv.font='600 193.12px NativeMono';let mc=cv.measureText('H');[[188,332,'21','h1'],[548,336,'32','h2']].forEach(([x,w,t,clip])=>{e('text',{x:x+w/2,y:194+(272+mc.actualBoundingBoxAscent)/2,'text-anchor':'middle','font-family':'NativeMono','font-size':193.12,'font-weight':600,fill:'#ece8da','clip-path':`url(#${clip})`},cg).textContent=t;rect(x,329,w,2,'#101211',cg)});document.querySelectorAll('text[font-family=DIN],text[font-family=NativeMono]').forEach(n=>typography.svgText(n,n.textContent,n.getAttribute('font-family')==='DIN'?'airport':'cuckoo'));document.documentElement.dataset.ready='true';})();
</script></html>
